<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu - HungerByte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-hb sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="index.html">
        <span class="fs-3">🍔</span>
        <span>Hunger<span class="brand-accent">Byte</span></span>
      </a>

      <div class="collapse navbar-collapse" id="hbNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="restaurants.html">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">Orders</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <a href="cart.html" class="btn btn-outline-dark position-relative rounded-3 px-3 py-2">
            🛒 Cart
            <span class="hb-cart-count cart-badge-count" style="display:none;">0</span>
          </a>
          <div id="navbar-auth-section"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Restaurant Banner Header -->
  <div class="bg-white border-bottom py-4" id="restaurantHeader">
    <div class="container">
      <div class="spinner-border text-warning" role="status"></div>
    </div>
  </div>

  <!-- Menu Content Section -->
  <div class="container py-4">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold mb-0">Recommended Dishes</h4>
          <span class="badge bg-light text-dark border px-3 py-2 rounded-3" id="menuItemsCount">0 Items</span>
        </div>

        <div class="d-flex flex-column gap-3" id="foodItemsContainer">
          <!-- Food item rows rendered dynamically -->
        </div>
      </div>

      <!-- Quick Cart Sidebar -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 90px;" id="sidebarCartBox">
          <h5 class="fw-bold mb-3 d-flex justify-content-between align-items-center">
            <span>Cart</span>
            <span class="fs-6 text-muted hb-cart-count-label">0 items</span>
          </h5>

          <div id="sidebarCartItems" class="d-flex flex-column gap-2 mb-3">
            <p class="text-muted small text-center my-4">Your cart is currently empty.<br>Add some delicious dishes!</p>
          </div>

          <div class="border-top pt-3" id="sidebarCartSummary" style="display: none;">
            <div class="d-flex justify-content-between mb-1 small">
              <span class="text-muted">Subtotal</span>
              <span class="fw-bold" id="sidebarSubtotal">₹0</span>
            </div>
            <div class="d-flex justify-content-between mb-3 small">
              <span class="text-muted">Delivery & Taxes</span>
              <span>₹40</span>
            </div>
            <a href="cart.html" class="btn btn-hb-primary w-100 py-2 fw-bold">Proceed to Checkout &rarr;</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    let currentRestaurantId = null;

    async function loadRestaurantDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      currentRestaurantId = urlParams.get('id') || 1;

      try {
        const res = await apiRequest(`/restaurants/${currentRestaurantId}`);
        const r = res.data;

        document.getElementById('restaurantHeader').innerHTML = `
          <div class="row align-items-center g-4">
            <div class="col-md-3">
              <img src="${r.imageUrl}" alt="${r.name}" class="img-fluid rounded-4 shadow-sm w-100" style="height: 180px; object-fit: cover;" onerror="handleImageError(this)">
            </div>
            <div class="col-md-9">
              <div class="d-flex align-items-center gap-2 mb-1">
                <h1 class="fw-bold mb-0">${r.name}</h1>
                <span class="badge bg-success px-2 py-1">★ ${r.rating} (${r.totalReviews} reviews)</span>
              </div>
              <p class="text-muted mb-2">${r.cuisine}</p>
              <div class="text-secondary small mb-3">📍 ${r.address} | 📞 ${r.phone || 'Available for delivery'}</div>
              <div class="d-flex gap-4 border-top pt-2 small text-muted">
                <div><strong>⏱️ Delivery Time:</strong> ${r.deliveryTimeMins} mins</div>
                <div><strong>💰 Cost for Two:</strong> ${formatINR(r.costForTwo)}</div>
                <div><strong>🚴 Delivery Fee:</strong> ₹40</div>
              </div>
            </div>
          </div>
        `;

        loadFoods(currentRestaurantId);
        refreshSidebarCart();
      } catch (e) {
        document.getElementById('restaurantHeader').innerHTML = `<div class="alert alert-danger">Failed to load restaurant.</div>`;
      }
    }

    async function loadFoods(restaurantId) {
      try {
        const res = await apiRequest(`/foods?restaurantId=${restaurantId}`);
        const foods = res.data || [];
        document.getElementById('menuItemsCount').textContent = `${foods.length} Items`;

        const container = document.getElementById('foodItemsContainer');
        if (foods.length === 0) {
          container.innerHTML = `<div class="text-center py-5 text-muted">No items currently available for this restaurant.</div>`;
          return;
        }

        container.innerHTML = foods.map(f => `
          <div class="card border-0 shadow-sm rounded-4 p-3 d-flex flex-row justify-content-between align-items-center">
            <div class="pe-3" style="max-width: 65%;">
              <div class="mb-1">
                <span class="${f.isVeg ? 'badge-veg-indicator' : 'badge-nonveg-indicator'}"></span>
                <span class="badge bg-light text-muted border ms-1">${f.category ? f.category.name : 'Main'}</span>
              </div>
              <a href="food-details.html?id=${f.id}" class="text-decoration-none text-dark">
                <h5 class="fw-bold mb-1">${f.name}</h5>
              </a>
              <div class="price-inr mb-2">${formatINR(f.price)}</div>
              <p class="text-muted small mb-0 text-truncate-2" style="font-size: 0.85rem;">${f.description || 'Prepared fresh with premium ingredients and hand-selected spices.'}</p>
            </div>
            <div class="text-center position-relative" style="width: 130px;">
              <img src="${f.imageUrl}" alt="${f.name}" class="rounded-3 shadow-sm mb-2" style="width: 120px; height: 90px; object-fit: cover;" onerror="handleImageError(this)">
              <button class="btn btn-sm btn-hb-primary px-3 py-1 fw-bold shadow-sm" onclick="addFoodToCart(${f.id})">
                ADD +
              </button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error('Error loading foods:', e);
      }
    }

    async function addFoodToCart(foodId) {
      try {
        const userId = AuthManager.getUserId();
        await apiRequest(`/cart/items?userId=${userId}`, {
          method: 'POST',
          body: JSON.stringify({ foodItemId: foodId, quantity: 1 })
        });
        showToast('Added to your cart!', 'success');
        updateNavCartBadge();
        refreshSidebarCart();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function refreshSidebarCart() {
      try {
        const userId = AuthManager.getUserId();
        const res = await apiRequest(`/cart?userId=${userId}`);
        const cart = res.data;
        const container = document.getElementById('sidebarCartItems');
        const summary = document.getElementById('sidebarCartSummary');

        if (!cart || !cart.items || cart.items.length === 0) {
          container.innerHTML = `<p class="text-muted small text-center my-4">Your cart is currently empty.<br>Add some delicious dishes!</p>`;
          summary.style.display = 'none';
          document.querySelector('.hb-cart-count-label').textContent = '0 items';
          return;
        }

        document.querySelector('.hb-cart-count-label').textContent = `${cart.items.length} items`;
        summary.style.display = 'block';

        let subtotal = 0;
        container.innerHTML = cart.items.map(item => {
          subtotal += item.price * item.quantity;
          return `
            <div class="d-flex justify-content-between align-items-center py-1 border-bottom">
              <div>
                <div class="small fw-semibold text-truncate" style="max-width: 140px;">${item.foodItem.name}</div>
                <div class="text-muted small">${formatINR(item.price)} × ${item.quantity}</div>
              </div>
              <span class="fw-bold small">${formatINR(item.price * item.quantity)}</span>
            </div>
          `;
        }).join('');

        document.getElementById('sidebarSubtotal').textContent = formatINR(subtotal);
      } catch (e) {
        console.warn('Error refreshing sidebar cart:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadRestaurantDetails);
  </script>
</body>
</html>
