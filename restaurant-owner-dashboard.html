<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Partner Portal - HungerByte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-hb sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand navbar-brand-logo" href="index.html">
        <span class="fs-3">🍔</span>
        <span>Hunger<span class="brand-accent">Byte</span> <span class="badge bg-primary fs-6 ms-2">Partner Portal</span></span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="btn btn-outline-secondary btn-sm">&larr; Live Storefront</a>
        <div id="navbar-auth-section"></div>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <!-- Partner Metric Highlights -->
    <div class="row g-3 mb-4">
      <div class="col-sm-6 col-lg-3">
        <div class="stat-card">
          <div>
            <div class="text-muted small fw-bold text-uppercase">Restaurant Sales</div>
            <div class="fs-3 fw-bold text-dark mt-1" id="ownerSales">₹4,850</div>
          </div>
          <div class="stat-icon bg-success bg-opacity-10 text-success">📈</div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="stat-card">
          <div>
            <div class="text-muted small fw-bold text-uppercase">Total Kitchen Orders</div>
            <div class="fs-3 fw-bold text-dark mt-1" id="ownerOrdersCount">12</div>
          </div>
          <div class="stat-icon bg-primary bg-opacity-10 text-primary">👨‍🍳</div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="stat-card">
          <div>
            <div class="text-muted small fw-bold text-uppercase">Active Dishes</div>
            <div class="fs-3 fw-bold text-dark mt-1" id="ownerDishesCount">6</div>
          </div>
          <div class="stat-icon bg-warning bg-opacity-10 text-warning">🍛</div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="stat-card">
          <div>
            <div class="text-muted small fw-bold text-uppercase">Customer Rating</div>
            <div class="fs-3 fw-bold text-dark mt-1">4.8 ★</div>
          </div>
          <div class="stat-icon bg-info bg-opacity-10 text-info">⭐</div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Live Orders Section -->
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Incoming Kitchen Orders 🔔</h5>
            <button class="btn btn-outline-dark btn-sm" onclick="loadOwnerOrders()">Refresh Orders</button>
          </div>

          <div class="d-flex flex-column gap-3" id="ownerOrdersList">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>

      <!-- Menu Items Management Section -->
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Kitchen Menu</h5>
            <button class="btn btn-hb-primary btn-sm fw-bold" data-bs-toggle="collapse" data-bs-target="#addNewDishCollapse">
              + New Dish
            </button>
          </div>

          <!-- Add dish inline collapse -->
          <div class="collapse mb-3" id="addNewDishCollapse">
            <div class="p-3 bg-light border rounded-3">
              <h6 class="fw-bold mb-2">Create New Food Item</h6>
              <form id="ownerAddDishForm">
                <div class="mb-2">
                  <input type="text" id="odName" class="form-control form-control-sm" placeholder="Dish Name" required>
                </div>
                <div class="row g-2 mb-2">
                  <div class="col-6">
                    <input type="number" id="odPrice" class="form-control form-control-sm" placeholder="Price (₹)" required>
                  </div>
                  <div class="col-6">
                    <select id="odIsVeg" class="form-select form-select-sm">
                      <option value="true">Veg 🟢</option>
                      <option value="false">Non-Veg 🔴</option>
                    </select>
                  </div>
                </div>
                <div class="mb-2">
                  <input type="text" id="odDesc" class="form-control form-control-sm" placeholder="Short description">
                </div>
                <button type="submit" class="btn btn-dark btn-sm w-100">Add to Kitchen Menu</button>
              </form>
            </div>
          </div>

          <div class="d-flex flex-column gap-2" id="ownerMenuContainer">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const TARGET_RESTAURANT_ID = 2; // Bangalore Biryani House

    async function loadOwnerOrders() {
      try {
        const res = await apiRequest(`/orders?restaurantId=${TARGET_RESTAURANT_ID}`);
        const orders = res.data || [];
        const container = document.getElementById('ownerOrdersList');

        document.getElementById('ownerOrdersCount').textContent = orders.length;

        if (orders.length === 0) {
          container.innerHTML = `
            <div class="p-4 bg-light rounded-3 text-center text-muted small">
              No pending orders for your restaurant at the moment.
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(o => {
          const itemsStr = (o.orderItems || []).map(i => `${i.quantity} × ${i.foodName}`).join(', ');
          return `
            <div class="p-3 border rounded-3 bg-white">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <span class="badge bg-dark me-1">${o.orderNumber}</span>
                  <span class="fw-bold">${o.user ? o.user.name : 'Customer'}</span>
                </div>
                <span class="badge ${o.orderStatus === 'DELIVERED' ? 'bg-success' : 'bg-primary'}">${o.orderStatus.replace(/_/g, ' ')}</span>
              </div>

              <div class="small text-secondary mb-2">${itemsStr}</div>

              <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                <span class="fw-bold text-dark">${formatINR(o.totalAmount)}</span>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-primary btn-sm" onclick="setOrderStatus(${o.id}, 'CONFIRMED')">Accept</button>
                  <button class="btn btn-outline-warning btn-sm text-dark" onclick="setOrderStatus(${o.id}, 'PREPARING')">Cook 🍳</button>
                  <button class="btn btn-outline-info btn-sm text-dark" onclick="setOrderStatus(${o.id}, 'READY_FOR_PICKUP')">Ready 📦</button>
                  <button class="btn btn-outline-success btn-sm" onclick="setOrderStatus(${o.id}, 'OUT_FOR_DELIVERY')">Dispatch 🛵</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function setOrderStatus(orderId, status) {
      try {
        await apiRequest(`/orders/${orderId}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status })
        });
        showToast(`Order updated to: ${status}`, 'success');
        loadOwnerOrders();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function loadOwnerMenu() {
      try {
        const res = await apiRequest(`/foods?restaurantId=${TARGET_RESTAURANT_ID}`);
        const foods = res.data || [];
        const cont = document.getElementById('ownerMenuContainer');
        document.getElementById('ownerDishesCount').textContent = foods.length;

        cont.innerHTML = foods.map(f => `
          <div class="p-2 border rounded-3 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
              <span class="${f.isVeg ? 'badge-veg-indicator' : 'badge-nonveg-indicator'}"></span>
              <div>
                <div class="fw-bold small">${f.name}</div>
                <div class="text-muted small">${formatINR(f.price)}</div>
              </div>
            </div>
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" role="switch" checked title="Toggle availability">
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('ownerAddDishForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('odName').value.trim();
      const price = parseFloat(document.getElementById('odPrice').value);
      const isVeg = document.getElementById('odIsVeg').value === 'true';
      const description = document.getElementById('odDesc').value.trim();

      try {
        await apiRequest('/foods', {
          method: 'POST',
          body: JSON.stringify({
            name,
            price,
            isVeg,
            description,
            restaurantId: TARGET_RESTAURANT_ID,
            categoryId: 1, // Biryani
            isAvailable: true
          })
        });
        showToast('New dish added to kitchen menu!', 'success');
        document.getElementById('odName').value = '';
        document.getElementById('odPrice').value = '';
        bootstrap.Collapse.getInstance(document.getElementById('addNewDishCollapse')).hide();
        loadOwnerMenu();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadOwnerOrders();
      loadOwnerMenu();
    });
  </script>
</body>
</html>
