<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants - HungerByte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-hb sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="index.html">
        <span class="fs-3">🍔</span>
        <span>Hunger<span class="brand-accent">Byte</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#hbNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="hbNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="restaurants.html">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="favorites.html">Favorites</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <a href="cart.html" class="btn btn-outline-dark position-relative rounded-3 px-3 py-2">
            🛒 Cart
            <span class="hb-cart-count cart-badge-count" style="display:none;">0</span>
          </a>
          <div id="navbar-auth-section" class="d-flex align-items-center"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Header Banner -->
  <div class="bg-white border-bottom py-4">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-md-6">
          <h1 class="fw-bold mb-1">Restaurants in Bangalore</h1>
          <p class="text-muted small mb-0">Order from top rated local dining spots and gourmet kitchens</p>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">🔍</span>
            <input type="text" id="restaurantSearchInput" class="form-control border-start-0 py-2" placeholder="Search by restaurant name, food or cuisine...">
            <button class="btn btn-hb-primary" id="searchSubmitBtn">Search</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <div class="row g-4">
      <!-- Filter Sidebar -->
      <div class="col-lg-3">
        <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 90px;">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Filters</h5>
            <button class="btn btn-link btn-sm text-decoration-none p-0 text-muted" id="clearFiltersBtn">Reset All</button>
          </div>

          <!-- Rating Filter -->
          <div class="mb-4">
            <label class="form-label fw-bold small text-uppercase text-secondary">Customer Rating</label>
            <div class="form-check">
              <input class="form-check-input filter-radio" type="radio" name="filterRating" id="ratingAny" value="0" checked>
              <label class="form-check-label small" for="ratingAny">Any Rating</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-radio" type="radio" name="filterRating" id="rating4" value="4.0">
              <label class="form-check-label small" for="rating4">4.0+ Stars ★★★★</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-radio" type="radio" name="filterRating" id="rating45" value="4.5">
              <label class="form-check-label small" for="rating45">4.5+ Top Rated ★★★★★</label>
            </div>
          </div>

          <!-- Cuisine Filter -->
          <div class="mb-4">
            <label class="form-label fw-bold small text-uppercase text-secondary">Cuisine</label>
            <select class="form-select form-select-sm rounded-3" id="cuisineSelect">
              <option value="">All Cuisines</option>
              <option value="Biryani">Biryani</option>
              <option value="North Indian">North Indian</option>
              <option value="South Indian">South Indian</option>
              <option value="Pizza">Pizza & Italian</option>
              <option value="Burger">Burgers & Fast Food</option>
              <option value="Chinese">Chinese & Asian</option>
            </select>
          </div>

          <!-- Max Delivery Time -->
          <div class="mb-4">
            <label class="form-label fw-bold small text-uppercase text-secondary">Delivery Time</label>
            <div class="form-check">
              <input class="form-check-input filter-radio" type="radio" name="filterDelivery" id="delivAny" value="999" checked>
              <label class="form-check-label small" for="delivAny">Any Delivery Time</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-radio" type="radio" name="filterDelivery" id="deliv25" value="25">
              <label class="form-check-label small" for="deliv25">Under 25 mins ⚡</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-radio" type="radio" name="filterDelivery" id="deliv30" value="30">
              <label class="form-check-label small" for="deliv30">Under 30 mins</label>
            </div>
          </div>

          <!-- Price for Two -->
          <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase text-secondary">Cost For Two</label>
            <div class="form-check">
              <input class="form-check-input filter-radio" type="radio" name="filterCost" id="costAny" value="9999" checked>
              <label class="form-check-label small" for="costAny">Any Price</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-radio" type="radio" name="filterCost" id="cost300" value="300">
              <label class="form-check-label small" for="cost300">Budget (Under ₹300)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-radio" type="radio" name="filterCost" id="cost450" value="450">
              <label class="form-check-label small" for="cost450">Mid-range (Under ₹450)</label>
            </div>
          </div>
        </div>
      </div>

      <!-- Restaurant Grid -->
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-muted small fw-semibold" id="resultsCount">Showing restaurants</span>
          <select class="form-select form-select-sm w-auto rounded-3" id="sortBySelect">
            <option value="rating">Sort: Top Rated</option>
            <option value="time">Sort: Fastest Delivery</option>
            <option value="cost_asc">Sort: Cost (Low to High)</option>
            <option value="cost_desc">Sort: Cost (High to Low)</option>
          </select>
        </div>

        <div class="row g-4" id="restaurantListGrid">
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    let allRestaurants = [];

    async function loadRestaurants() {
      const urlParams = new URLSearchParams(window.location.search);
      const querySearch = urlParams.get('search');
      if (querySearch) {
        document.getElementById('restaurantSearchInput').value = querySearch;
      }

      try {
        const res = await apiRequest('/restaurants');
        if (res && res.data) {
          allRestaurants = res.data;
          applyFilters();
        }
      } catch (err) {
        console.error('Error fetching restaurants:', err);
        document.getElementById('restaurantListGrid').innerHTML = `
          <div class="col-12 text-center py-5 text-muted">
            <p>Could not load restaurants right now.</p>
          </div>
        `;
      }
    }

    function applyFilters() {
      const searchVal = document.getElementById('restaurantSearchInput').value.toLowerCase().trim();
      const minRating = parseFloat(document.querySelector('input[name="filterRating"]:checked')?.value || 0);
      const cuisineVal = document.getElementById('cuisineSelect').value.toLowerCase();
      const maxDeliv = parseInt(document.querySelector('input[name="filterDelivery"]:checked')?.value || 999);
      const maxCost = parseFloat(document.querySelector('input[name="filterCost"]:checked')?.value || 9999);
      const sortBy = document.getElementById('sortBySelect').value;

      let filtered = allRestaurants.filter(r => {
        const matchSearch = !searchVal ||
          r.name.toLowerCase().includes(searchVal) ||
          r.cuisine.toLowerCase().includes(searchVal) ||
          r.address.toLowerCase().includes(searchVal);

        const matchRating = r.rating >= minRating;
        const matchCuisine = !cuisineVal || r.cuisine.toLowerCase().includes(cuisineVal);
        const matchDeliv = r.deliveryTimeMins <= maxDeliv;
        const matchCost = r.costForTwo <= maxCost;

        return matchSearch && matchRating && matchCuisine && matchDeliv && matchCost;
      });

      // Sorting
      if (sortBy === 'rating') {
        filtered.sort((a, b) => b.rating - a.rating);
      } else if (sortBy === 'time') {
        filtered.sort((a, b) => a.deliveryTimeMins - b.deliveryTimeMins);
      } else if (sortBy === 'cost_asc') {
        filtered.sort((a, b) => a.costForTwo - b.costForTwo);
      } else if (sortBy === 'cost_desc') {
        filtered.sort((a, b) => b.costForTwo - a.costForTwo);
      }

      renderList(filtered);
    }

    function renderList(list) {
      const grid = document.getElementById('restaurantListGrid');
      const countEl = document.getElementById('resultsCount');
      countEl.textContent = `Showing ${list.length} restaurant${list.length === 1 ? '' : 's'}`;

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <div class="fs-1 mb-2">🍽️</div>
            <h5 class="fw-bold">No restaurants found</h5>
            <p class="text-muted small">Try tweaking your search or resetting the active filters.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(r => `
        <div class="col-md-6 col-lg-4">
          <div class="hb-card">
            <div class="img-container">
              <a href="restaurant-details.html?id=${r.id}">
                <img src="${r.imageUrl}" alt="${r.name}" class="hb-card-img-top" onerror="handleImageError(this)">
              </a>
              <div class="badge-overlay-rating">★ ${r.rating}</div>
            </div>
            <div class="p-3 d-flex flex-column flex-grow-1">
              <div class="d-flex justify-content-between align-items-start mb-1">
                <a href="restaurant-details.html?id=${r.id}" class="text-decoration-none text-dark">
                  <h5 class="fw-bold mb-0 text-truncate" style="max-width: 190px;">${r.name}</h5>
                </a>
                <button class="btn btn-link btn-sm p-0 text-danger text-decoration-none" onclick="toggleFavRestaurant(${r.id})">❤️</button>
              </div>
              <p class="text-muted small mb-2 text-truncate">${r.cuisine}</p>
              <div class="text-secondary small mb-3 text-truncate">📍 ${r.address}</div>

              <div class="mt-auto d-flex justify-content-between align-items-center pt-2 border-top small text-muted">
                <span>⏱️ ${r.deliveryTimeMins} mins</span>
                <span class="fw-bold text-dark">${formatINR(r.costForTwo)} for two</span>
              </div>
              <a href="restaurant-details.html?id=${r.id}" class="btn btn-outline-dark btn-sm w-100 mt-2 fw-semibold">View Menu &rarr;</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function toggleFavRestaurant(restId) {
      try {
        const userId = AuthManager.getUserId();
        await apiRequest(`/favorites?userId=${userId}&restaurantId=${restId}`, { method: 'POST' });
        showToast('Saved to your favorites!', 'success');
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadRestaurants();

      document.querySelectorAll('.filter-radio').forEach(radio => {
        radio.addEventListener('change', applyFilters);
      });
      document.getElementById('cuisineSelect').addEventListener('change', applyFilters);
      document.getElementById('sortBySelect').addEventListener('change', applyFilters);
      document.getElementById('searchSubmitBtn').addEventListener('click', applyFilters);
      document.getElementById('restaurantSearchInput').addEventListener('input', applyFilters);

      document.getElementById('clearFiltersBtn').addEventListener('click', () => {
        document.getElementById('ratingAny').checked = true;
        document.getElementById('delivAny').checked = true;
        document.getElementById('costAny').checked = true;
        document.getElementById('cuisineSelect').value = '';
        document.getElementById('restaurantSearchInput').value = '';
        applyFilters();
      });
    });
  </script>
</body>
</html>
