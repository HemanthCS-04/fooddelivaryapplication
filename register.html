<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - HungerByte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-hb">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="index.html">
        <span class="fs-3">🍔</span>
        <span>Hunger<span class="brand-accent">Byte</span></span>
      </a>
      <a href="login.html" class="btn btn-outline-secondary btn-sm">Already have an account? Sign In</a>
    </div>
  </nav>

  <main class="d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 540px;">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <span class="fs-1">🚀</span>
          <h2 class="fw-bold mt-2 mb-1">Create an Account</h2>
          <p class="text-muted small">Join HungerByte as a Customer, Restaurant Owner, or Admin</p>
        </div>

        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Full Name *</label>
            <input type="text" id="regName" class="form-control py-2 rounded-3" placeholder="e.g. Anand Kumar" required>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Email Address *</label>
              <input type="email" id="regEmail" class="form-control py-2 rounded-3" placeholder="name@domain.com" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Mobile Number *</label>
              <input type="tel" id="regMobile" class="form-control py-2 rounded-3" placeholder="10-digit number" required>
            </div>
          </div>

          <!-- Role Dropdown as required by prompt -->
          <div class="mb-3">
            <label class="form-label fw-semibold small">Register As (Role) *</label>
            <select id="regRole" class="form-select py-2 rounded-3" required>
              <option value="CUSTOMER" selected>CUSTOMER (Order delicious food)</option>
              <option value="RESTAURANT_OWNER">RESTAURANT_OWNER (Manage restaurant & foods)</option>
              <option value="ADMIN">ADMIN (System administration)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold small">Delivery Address *</label>
            <input type="text" id="regAddress" class="form-control py-2 rounded-3" placeholder="Flat No, Building, Street, Area" required>
          </div>

          <div class="row g-2 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Password *</label>
              <input type="password" id="regPassword" class="form-control py-2 rounded-3" placeholder="Min 6 characters" minlength="6" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Confirm Password *</label>
              <input type="password" id="regConfirmPassword" class="form-control py-2 rounded-3" placeholder="Re-enter password" minlength="6" required>
            </div>
          </div>

          <button type="submit" class="btn btn-hb-primary w-100 py-2" id="regSubmitBtn">
            Create Account
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted">
          Already registered? <a href="login.html" class="fw-bold text-hb-primary text-decoration-none">Sign In Here</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const mobile = document.getElementById('regMobile').value.trim();
      const role = document.getElementById('regRole').value;
      const address = document.getElementById('regAddress').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const btn = document.getElementById('regSubmitBtn');

      if (password !== confirmPassword) {
        showToast('Passwords do not match! Please check again.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating account...`;

      try {
        const res = await apiRequest('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name, email, mobile, role, address, password, confirmPassword
          })
        });

        if (res.success && res.data) {
          AuthManager.setUser(res.data);
          showToast('Account registered successfully! Redirecting...', 'success');
          setTimeout(() => {
            if (res.data.role === 'ADMIN') {
              window.location.href = "admin-dashboard.html";
            } else if (res.data.role === 'RESTAURANT_OWNER') {
              window.location.href = "restaurant-owner-dashboard.html";
            } else {
              window.location.href = "index.html";
            }
          }, 800);
        }
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerText = 'Create Account';
      }
    });
  </script>
</body>
</html>
