# ===================================================================
# HungerByte - Spring Boot Application Configuration
# ===================================================================

# Application Name & Port
spring.application.name=HungerByte
server.port=8080

# MySQL Database Configuration
# Database name: hungerbyte_db
# Credentials specified by user: username=root, password=Hemanth@1
spring.datasource.url=jdbc:mysql://localhost:3306/hungerbyte_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Hemanth@1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Spring Boot Static Resources (serves src/main/resources/static at /)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging Configuration
logging.level.com.hungerbyte=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
