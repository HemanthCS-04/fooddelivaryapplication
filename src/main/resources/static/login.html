<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HungerByte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-hb">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html">
        <span class="fs-3">🍔</span>
        <span>Hunger<span class="brand-accent">Byte</span></span>
      </a>
      <a href="/index.html" class="btn btn-outline-secondary btn-sm">&larr; Back to Home</a>
    </div>
  </nav>

  <main class="d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 480px;">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <span class="fs-1">👋</span>
          <h2 class="fw-bold mt-2 mb-1">Welcome Back</h2>
          <p class="text-muted small">Sign in to order your favorite dishes on HungerByte</p>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Email Address</label>
            <input type="email" id="loginEmail" class="form-control py-2 rounded-3" placeholder="name@example.com" required value="customer@hungerbyte.com">
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label fw-semibold small mb-0">Password</label>
              <a href="#" class="small text-decoration-none text-muted" onclick="showToast('Use demo password: customer123', 'info'); return false;">Forgot?</a>
            </div>
            <input type="password" id="loginPassword" class="form-control py-2 rounded-3" placeholder="••••••••" required value="customer123">
          </div>

          <button type="submit" class="btn btn-hb-primary w-100 py-2 mt-2" id="loginSubmitBtn">
            Sign In
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted">
          Don't have an account? <a href="/register.html" class="fw-bold text-hb-primary text-decoration-none">Create an Account</a>
        </div>

        <!-- Quick 1-Click Role Switcher for Testing & Evaluation -->
        <div class="mt-4 p-3 bg-light rounded-3 border">
          <div class="fw-bold small text-secondary mb-2 text-uppercase" style="font-size:0.75rem;">⚡ Quick Demo Login</div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm flex-fill" onclick="fillAndLogin('customer@hungerbyte.com', 'customer123')">
              Customer
            </button>
            <button class="btn btn-outline-primary btn-sm flex-fill" onclick="fillAndLogin('owner@hungerbyte.com', 'owner123')">
              Owner
            </button>
            <button class="btn btn-outline-danger btn-sm flex-fill" onclick="fillAndLogin('admin@hungerbyte.com', 'admin123')">
              Admin
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    function fillAndLogin(email, pass) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pass;
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Signing in...`;

      try {
        const res = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (res.success && res.data) {
          AuthManager.setUser(res.data);
          showToast(`Welcome back, ${res.data.name}!`, 'success');
          setTimeout(() => {
            if (res.data.role === 'ADMIN') {
              window.location.href = '/admin-dashboard.html';
            } else if (res.data.role === 'RESTAURANT_OWNER') {
              window.location.href = '/restaurant-owner-dashboard.html';
            } else {
              window.location.href = '/index.html';
            }
          }, 600);
        }
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerText = 'Sign In';
      }
    });
  </script>
</body>
</html>
