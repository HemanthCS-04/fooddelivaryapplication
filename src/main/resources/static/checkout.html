<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - HungerByte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-hb sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html">
        <span class="fs-3">🍔</span>
        <span>Hunger<span class="brand-accent">Byte</span></span>
      </a>
      <a href="/cart.html" class="btn btn-outline-secondary btn-sm">&larr; Return to Cart</a>
    </div>
  </nav>

  <main class="container py-5">
    <h2 class="fw-bold mb-4">Complete Your Order 🛵</h2>

    <div class="row g-4">
      <!-- Left Column: Address and Payment Method -->
      <div class="col-lg-8">

        <!-- 1. Delivery Address Card -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">1. Delivery Address</h5>
            <button class="btn btn-outline-dark btn-sm" data-bs-toggle="collapse" data-bs-target="#newAddressCollapse">
              + Add New Address
            </button>
          </div>

          <div id="savedAddressesList" class="d-flex flex-column gap-2 mb-3">
            <div class="p-3 border rounded-3 bg-light">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="addressOption" id="addr1" checked value="42, 4th Cross, Indiranagar, Bangalore, Karnataka - 560038">
                <label class="form-check-label small" for="addr1">
                  <strong>Home</strong> &bull; 42, 4th Cross, Indiranagar, Bangalore, Karnataka - 560038
                </label>
              </div>
            </div>
            <div class="p-3 border rounded-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="addressOption" id="addr2" value="Bagmane Tech Park, CV Raman Nagar, Bangalore - 560093">
                <label class="form-check-label small" for="addr2">
                  <strong>Office</strong> &bull; Bagmane Tech Park, CV Raman Nagar, Bangalore - 560093
                </label>
              </div>
            </div>
          </div>

          <!-- Add New Address Collapsible Form -->
          <div class="collapse mt-3" id="newAddressCollapse">
            <div class="p-3 border rounded-3 bg-light">
              <h6 class="fw-bold mb-2">New Address Details</h6>
              <div class="row g-2">
                <div class="col-12">
                  <input type="text" id="newAddrStreet" class="form-control form-control-sm" placeholder="Flat No, Building, Street, Landmark">
                </div>
                <div class="col-md-4">
                  <input type="text" id="newAddrCity" class="form-control form-control-sm" placeholder="City" value="Bangalore">
                </div>
                <div class="col-md-4">
                  <input type="text" id="newAddrState" class="form-control form-control-sm" placeholder="State" value="Karnataka">
                </div>
                <div class="col-md-4">
                  <input type="text" id="newAddrPincode" class="form-control form-control-sm" placeholder="Pincode" value="560001">
                </div>
                <div class="col-12">
                  <button type="button" class="btn btn-sm btn-dark" onclick="saveNewAddressInline()">Use This Address</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 2. Payment Method Card -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <h5 class="fw-bold mb-3">2. Choose Payment Method</h5>

          <div class="d-flex flex-column gap-3">
            <label class="p-3 border rounded-3 d-flex align-items-center justify-content-between pointer payment-card-option">
              <div class="form-check mb-0">
                <input class="form-check-input" type="radio" name="paymentMethod" id="pmUpi" value="UPI" checked>
                <label class="form-check-label fw-bold text-dark" for="pmUpi">
                  UPI (Google Pay, PhonePe, Paytm, BHIM)
                </label>
                <div class="small text-muted">Instant payment through any UPI app</div>
              </div>
              <span class="fs-4">⚡</span>
            </label>

            <label class="p-3 border rounded-3 d-flex align-items-center justify-content-between pointer payment-card-option">
              <div class="form-check mb-0">
                <input class="form-check-input" type="radio" name="paymentMethod" id="pmCod" value="CASH_ON_DELIVERY">
                <label class="form-check-label fw-bold text-dark" for="pmCod">
                  Cash on Delivery (COD)
                </label>
                <div class="small text-muted">Pay in cash or UPI when your food arrives</div>
              </div>
              <span class="fs-4">💵</span>
            </label>

            <label class="p-3 border rounded-3 d-flex align-items-center justify-content-between pointer payment-card-option">
              <div class="form-check mb-0">
                <input class="form-check-input" type="radio" name="paymentMethod" id="pmCredit" value="CREDIT_CARD">
                <label class="form-check-label fw-bold text-dark" for="pmCredit">
                  Credit Card
                </label>
                <div class="small text-muted">Visa, Mastercard, RuPay, Amex</div>
              </div>
              <span class="fs-4">💳</span>
            </label>

            <label class="p-3 border rounded-3 d-flex align-items-center justify-content-between pointer payment-card-option">
              <div class="form-check mb-0">
                <input class="form-check-input" type="radio" name="paymentMethod" id="pmDebit" value="DEBIT_CARD">
                <label class="form-check-label fw-bold text-dark" for="pmDebit">
                  Debit Card / Net Banking
                </label>
                <div class="small text-muted">All major Indian banks supported</div>
              </div>
              <span class="fs-4">🏦</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Right Column: Order Summary & Place Order -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white sticky-top" style="top: 90px;">
          <h5 class="fw-bold mb-3">Order Summary</h5>

          <div id="checkoutItemsList" class="d-flex flex-column gap-2 mb-3 pb-3 border-bottom small">
            <!-- Rendered dynamically -->
          </div>

          <div class="d-flex justify-content-between mb-2 small">
            <span class="text-muted">Subtotal</span>
            <span class="fw-semibold" id="coSubtotal">₹0</span>
          </div>

          <div class="d-flex justify-content-between mb-2 small">
            <span class="text-muted">Standard Delivery</span>
            <span class="fw-semibold">₹40</span>
          </div>

          <div class="d-flex justify-content-between mb-2 small">
            <span class="text-muted">GST & Taxes (5%)</span>
            <span class="fw-semibold" id="coTax">₹0</span>
          </div>

          <div class="d-flex justify-content-between mb-2 small text-success" id="coDiscountRow" style="display: none;">
            <span>Coupon Discount (<span id="coCouponName"></span>)</span>
            <span class="fw-bold" id="coDiscount">-₹0</span>
          </div>

          <hr class="my-3">

          <div class="d-flex justify-content-between mb-4 align-items-center">
            <div>
              <span class="fw-bold fs-5 text-dark">Grand Total</span>
              <div class="small text-muted">Inclusive of taxes</div>
            </div>
            <span class="fw-bold fs-4 text-hb-primary" id="coGrandTotal">₹0</span>
          </div>

          <button class="btn btn-hb-primary btn-lg w-100 fw-bold shadow-sm" id="placeOrderBtn">
            Confirm & Place Order
          </button>

          <div class="text-center mt-3 small text-muted">
            🔒 Safe & Secure 256-bit Mock Payments
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let checkoutData = null;
    let userCart = null;

    async function initCheckout() {
      try {
        const userId = AuthManager.getUserId();
        const res = await apiRequest(`/cart?userId=${userId}`);
        userCart = res.data;

        if (!userCart || !userCart.items || userCart.items.length === 0) {
          showToast('Your cart is empty. Redirecting...', 'info');
          setTimeout(() => window.location.href = '/restaurants.html', 1000);
          return;
        }

        // Render mini items list
        const itemsList = document.getElementById('checkoutItemsList');
        itemsList.innerHTML = userCart.items.map(item => `
          <div class="d-flex justify-content-between">
            <span class="text-truncate" style="max-width: 170px;">${item.quantity} × ${item.foodItem.name}</span>
            <span class="fw-semibold">${formatINR(item.price * item.quantity)}</span>
          </div>
        `).join('');

        // Calculate bill
        const subtotal = userCart.items.reduce((s, i) => s + (i.price * i.quantity), 0);
        const deliveryFee = 40.0;
        const tax = Math.round((subtotal * 0.05) * 100) / 100;

        // Check if coupon saved in session
        const sessionInfo = JSON.parse(sessionStorage.getItem('hb_checkout_summary') || '{}');
        const discount = sessionInfo.discount || 0;
        const couponCode = sessionInfo.couponCode || null;

        const grandTotal = Math.max(0, Math.round((subtotal + deliveryFee + tax - discount) * 100) / 100);

        document.getElementById('coSubtotal').textContent = formatINR(subtotal);
        document.getElementById('coTax').textContent = formatINR(tax);

        if (discount > 0) {
          document.getElementById('coDiscountRow').style.display = 'flex';
          document.getElementById('coCouponName').textContent = couponCode;
          document.getElementById('coDiscount').textContent = `-${formatINR(discount)}`;
        }

        document.getElementById('coGrandTotal').textContent = formatINR(grandTotal);

        checkoutData = {
          restaurantId: (userCart.items[0] && userCart.items[0].foodItem && userCart.items[0].foodItem.restaurant) ? userCart.items[0].foodItem.restaurant.id : 1,
          couponCode
        };
      } catch (e) {
        showToast('Error loading checkout: ' + e.message, 'error');
      }
    }

    function saveNewAddressInline() {
      const street = document.getElementById('newAddrStreet').value.trim();
      const city = document.getElementById('newAddrCity').value.trim();
      const state = document.getElementById('newAddrState').value.trim();
      const pincode = document.getElementById('newAddrPincode').value.trim();

      if (!street || !city || !pincode) {
        showToast('Please fill all address fields', 'error');
        return;
      }

      const fullAddr = `${street}, ${city}, ${state} - ${pincode}`;
      const list = document.getElementById('savedAddressesList');
      const newId = 'addr_' + Date.now();

      const newElem = document.createElement('div');
      newElem.className = 'p-3 border rounded-3 bg-light';
      newElem.innerHTML = `
        <div class="form-check">
          <input class="form-check-input" type="radio" name="addressOption" id="${newId}" value="${fullAddr}" checked>
          <label class="form-check-label small" for="${newId}">
            <strong>Custom Address</strong> &bull; ${fullAddr}
          </label>
        </div>
      `;
      list.prepend(newElem);
      bootstrap.Collapse.getInstance(document.getElementById('newAddressCollapse')).hide();
      showToast('Address added and selected!', 'success');
    }

    document.getElementById('placeOrderBtn').addEventListener('click', async () => {
      const selectedAddrEl = document.querySelector('input[name="addressOption"]:checked');
      if (!selectedAddrEl) {
        showToast('Please select or add a delivery address', 'error');
        return;
      }
      const deliveryAddress = selectedAddrEl.value;

      const selectedPaymentEl = document.querySelector('input[name="paymentMethod"]:checked');
      const paymentMethod = selectedPaymentEl ? selectedPaymentEl.value : 'UPI';

      const btn = document.getElementById('placeOrderBtn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Processing Order...`;

      try {
        const userId = AuthManager.getUserId();
        const res = await apiRequest(`/orders?userId=${userId}`, {
          method: 'POST',
          body: JSON.stringify({
            restaurantId: checkoutData.restaurantId,
            deliveryAddress: deliveryAddress,
            paymentMethod: paymentMethod,
            couponCode: checkoutData.couponCode
          })
        });

        if (res.success && res.data) {
          showToast('Order placed successfully! Redirecting...', 'success');
          sessionStorage.removeItem('hb_checkout_summary');
          updateNavCartBadge();
          setTimeout(() => {
            window.location.href = `/order-details.html?id=${res.data.id}`;
          }, 800);
        }
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerText = 'Confirm & Place Order';
      }
    });

    document.addEventListener('DOMContentLoaded', initCheckout);
  </script>
</body>
</html>
