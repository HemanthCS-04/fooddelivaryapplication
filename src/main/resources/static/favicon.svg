<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff6b00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Glowing Aura Accent -->
  <circle cx="32" cy="32" r="22" fill="#ff6b00" opacity="0.08"/>

  <!-- Burger Top Bun with Byte Notch -->
  <path d="M16 28 C16 18, 48 18, 48 28 Z" fill="url(#brandGrad)" filter="url(#glow)"/>
  
  <!-- Sesame seeds -->
  <circle cx="25" cy="23" r="1.3" fill="#ffedd5" opacity="0.9"/>
  <circle cx="32" cy="21" r="1.3" fill="#ffedd5" opacity="0.9"/>
  <circle cx="39" cy="23" r="1.3" fill="#ffedd5" opacity="0.9"/>

  <!-- Melted Cheese / Patty Layer -->
  <path d="M15 31 H49 C49 32.5, 47 34, 45 34 L40 37 L35 34 L29 37 L24 34 C22 34, 15 33, 15 31 Z" fill="url(#cheeseGrad)"/>

  <!-- Burger Patty -->
  <rect x="16" y="36" width="32" height="4.5" rx="2.25" fill="#78350f"/>

  <!-- Bottom Bun -->
  <path d="M17 43.5 C17 47, 47 47, 47 43.5 Z" fill="url(#brandGrad)"/>

  <!-- Digital 'Byte' Pixel Grid Accent (Top Right) -->
  <rect x="42" y="14" width="4" height="4" rx="1" fill="#38bdf8"/>
  <rect x="47" y="14" width="4" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
  <rect x="47" y="19" width="4" height="4" rx="1" fill="#38bdf8"/>
</svg>
