<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Details - HungerByte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-hb sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html">
        <span class="fs-3">🍔</span>
        <span>Hunger<span class="brand-accent">Byte</span></span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="/restaurants.html" class="btn btn-outline-secondary btn-sm">&larr; Back to Restaurants</a>
        <a href="/cart.html" class="btn btn-outline-dark position-relative rounded-3 px-3 py-2">
          🛒 Cart
          <span class="hb-cart-count cart-badge-count" style="display:none;">0</span>
        </a>
        <div id="navbar-auth-section"></div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-5" id="foodDetailCard">
      <div class="row g-0">
        <div class="col-md-5">
          <img id="foodImg" src="" alt="Food" class="w-100 h-100" style="min-height: 380px; object-fit: cover;" onerror="handleImageError(this)">
        </div>
        <div class="col-md-7 p-4 p-md-5 d-flex flex-column justify-content-between">
          <div>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span id="vegIndicator" class="badge-veg-indicator"></span>
              <span id="foodCategoryBadge" class="badge bg-light text-muted border">Category</span>
              <span class="badge bg-success">★ <span id="foodRating">4.5</span> (<span id="reviewCount">12</span> reviews)</span>
            </div>

            <h1 class="fw-bold mb-2" id="foodName">Loading Dish...</h1>
            <p class="text-muted small mb-3">by <a href="#" id="restaurantLink" class="text-decoration-none fw-semibold">Restaurant</a></p>

            <div class="fs-2 fw-bold text-dark mb-3" id="foodPrice">₹0</div>

            <p class="text-secondary mb-4" id="foodDescription">
              Delicious dish prepared fresh with hand-selected ingredients and aromatic spices.
            </p>

            <!-- Variants selector -->
            <div class="mb-4" id="variantSection" style="display: none;">
              <label class="form-label fw-bold small text-uppercase text-secondary">Select Portion / Variant</label>
              <div class="d-flex gap-2" id="variantOptions"></div>
            </div>

            <!-- Quantity Selector -->
            <div class="d-flex align-items-center gap-3 mb-4">
              <label class="form-label fw-bold small text-uppercase text-secondary mb-0">Quantity</label>
              <div class="input-group" style="width: 130px;">
                <button class="btn btn-outline-secondary" type="button" onclick="adjustQty(-1)">-</button>
                <input type="text" id="foodQuantity" class="form-control text-center fw-bold" value="1" readonly>
                <button class="btn btn-outline-secondary" type="button" onclick="adjustQty(1)">+</button>
              </div>
            </div>
          </div>

          <div class="d-flex gap-3">
            <button class="btn btn-hb-primary btn-lg flex-grow-1 fw-bold shadow-sm" id="addToCartBtn">
              Add to Cart 🛒
            </button>
            <button class="btn btn-outline-danger btn-lg px-4" id="favFoodBtn">
              ❤️ Favorite
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Customer Reviews Section -->
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">Customer Reviews</h4>
            <span class="badge bg-light text-dark border p-2" id="totalReviewsHeader">Reviews</span>
          </div>

          <div id="reviewsList" class="d-flex flex-column gap-3 mb-4">
            <p class="text-muted small">Loading reviews...</p>
          </div>
        </div>
      </div>

      <!-- Write a Review Form -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white sticky-top" style="top: 90px;">
          <h5 class="fw-bold mb-3">Write a Review</h5>
          <form id="reviewForm">
            <div class="mb-3">
              <label class="form-label fw-semibold small">Rating</label>
              <select class="form-select rounded-3" id="reviewRating" required>
                <option value="5">★★★★★ - Excellent (5)</option>
                <option value="4" selected>★★★★☆ - Very Good (4)</option>
                <option value="3">★★★☆☆ - Average (3)</option>
                <option value="2">★★☆☆☆ - Poor (2)</option>
                <option value="1">★☆☆☆☆ - Terrible (1)</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Your Feedback</label>
              <textarea class="form-control rounded-3" id="reviewComment" rows="3" placeholder="How was the taste, packaging, and portion size?" required></textarea>
            </div>
            <button type="submit" class="btn btn-hb-primary w-100 fw-bold">Submit Review</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let currentFood = null;
    let selectedVariantId = null;
    let basePrice = 0;

    function adjustQty(delta) {
      const input = document.getElementById('foodQuantity');
      let val = parseInt(input.value) + delta;
      if (val < 1) val = 1;
      if (val > 20) val = 20;
      input.value = val;
    }

    async function loadFoodDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const foodId = urlParams.get('id') || 1;

      try {
        const res = await apiRequest(`/foods/${foodId}`);
        currentFood = res.data;
        basePrice = currentFood.price;

        document.getElementById('foodImg').src = currentFood.imageUrl;
        document.getElementById('foodName').textContent = currentFood.name;
        document.getElementById('foodPrice').textContent = formatINR(currentFood.price);
        document.getElementById('foodDescription').textContent = currentFood.description || 'Delicious gourmet food item made fresh on order.';
        document.getElementById('foodRating').textContent = currentFood.rating || '4.5';
        document.getElementById('reviewCount').textContent = currentFood.totalReviews || '12';

        if (currentFood.restaurant) {
          const restLink = document.getElementById('restaurantLink');
          restLink.textContent = currentFood.restaurant.name;
          restLink.href = `/restaurant-details.html?id=${currentFood.restaurant.id}`;
        }

        if (currentFood.category) {
          document.getElementById('foodCategoryBadge').textContent = currentFood.category.name;
        }

        const vegInd = document.getElementById('vegIndicator');
        vegInd.className = currentFood.isVeg ? 'badge-veg-indicator' : 'badge-nonveg-indicator';

        // Check Variants
        if (currentFood.variants && currentFood.variants.length > 0) {
          const varSec = document.getElementById('variantSection');
          const varOpt = document.getElementById('variantOptions');
          varSec.style.display = 'block';

          varOpt.innerHTML = currentFood.variants.map((v, idx) => `
            <button type="button" class="btn btn-outline-dark btn-sm variant-btn ${idx === 0 ? 'active' : ''}" data-id="${v.id}" data-price="${v.price}" onclick="selectVariant(this, ${v.id}, ${v.price})">
              ${v.name} (${formatINR(v.price)})
            </button>
          `).join('');

          selectedVariantId = currentFood.variants[0].id;
          document.getElementById('foodPrice').textContent = formatINR(currentFood.variants[0].price);
        }

        loadReviews(currentFood.id);
      } catch (e) {
        showToast('Error loading food details: ' + e.message, 'error');
      }
    }

    function selectVariant(btn, variantId, price) {
      document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedVariantId = variantId;
      document.getElementById('foodPrice').textContent = formatINR(price);
    }

    async function loadReviews(foodId) {
      try {
        const res = await apiRequest(`/reviews/food/${foodId}`);
        const reviews = res.data || [];
        const container = document.getElementById('reviewsList');
        document.getElementById('totalReviewsHeader').textContent = `${reviews.length} Verified Reviews`;

        if (reviews.length === 0) {
          container.innerHTML = `
            <div class="p-3 bg-light rounded-3 text-muted small">
              No customer reviews yet. Be the first to try and rate this dish!
            </div>
          `;
          return;
        }

        container.innerHTML = reviews.map(r => `
          <div class="border-bottom pb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="fw-bold">${r.user ? r.user.name : 'Verified Customer'}</span>
              <span class="badge bg-warning text-dark">★ ${r.rating} / 5</span>
            </div>
            <p class="text-secondary small mb-1">${r.comment}</p>
            <span class="text-muted" style="font-size: 0.75rem;">Verified Order</span>
          </div>
        `).join('');
      } catch (e) {
        console.warn('Could not load reviews:', e);
      }
    }

    document.getElementById('addToCartBtn').addEventListener('click', async () => {
      if (!currentFood) return;
      const qty = parseInt(document.getElementById('foodQuantity').value);
      try {
        const userId = AuthManager.getUserId();
        await apiRequest(`/cart/items?userId=${userId}`, {
          method: 'POST',
          body: JSON.stringify({
            foodItemId: currentFood.id,
            variantId: selectedVariantId,
            quantity: qty
          })
        });
        showToast(`Added ${qty} × ${currentFood.name} to cart!`, 'success');
        updateNavCartBadge();
      } catch (e) {
        showToast(e.message, 'error');
      }
    });

    document.getElementById('favFoodBtn').addEventListener('click', async () => {
      if (!currentFood) return;
      try {
        const userId = AuthManager.getUserId();
        await apiRequest(`/favorites?userId=${userId}&foodItemId=${currentFood.id}`, { method: 'POST' });
        showToast('Saved to your favorites!', 'success');
      } catch (e) {
        showToast(e.message, 'error');
      }
    });

    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentFood) return;
      const rating = parseInt(document.getElementById('reviewRating').value);
      const comment = document.getElementById('reviewComment').value.trim();

      try {
        const userId = AuthManager.getUserId();
        await apiRequest(`/reviews?userId=${userId}`, {
          method: 'POST',
          body: JSON.stringify({
            foodItemId: currentFood.id,
            rating,
            comment
          })
        });
        showToast('Thank you! Review posted.', 'success');
        document.getElementById('reviewComment').value = '';
        loadReviews(currentFood.id);
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.addEventListener('DOMContentLoaded', loadFoodDetails);
  </script>
</body>
</html>
