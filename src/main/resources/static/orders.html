<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - HungerByte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-hb sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html">
        <span class="fs-3">🍔</span>
        <span>Hunger<span class="brand-accent">Byte</span></span>
      </a>

      <div class="collapse navbar-collapse" id="hbNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/restaurants.html">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link active" href="/orders.html">Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="/favorites.html">Favorites</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <a href="/cart.html" class="btn btn-outline-dark position-relative rounded-3 px-3 py-2">
            🛒 Cart
            <span class="hb-cart-count cart-badge-count" style="display:none;">0</span>
          </a>
          <div id="navbar-auth-section"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">Your Orders 📦</h2>
        <p class="text-muted small mb-0">Track real-time status and view detailed history</p>
      </div>
      <a href="/restaurants.html" class="btn btn-hb-primary btn-sm fw-semibold">+ Order More Food</a>
    </div>

    <div class="row g-4" id="ordersListContainer">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-danger" role="status"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    async function loadUserOrders() {
      try {
        const userId = AuthManager.getUserId();
        const res = await apiRequest(`/orders?userId=${userId}`);
        const orders = res.data || [];
        const container = document.getElementById('ordersListContainer');

        if (orders.length === 0) {
          container.innerHTML = `
            <div class="col-12 text-center py-5 bg-white rounded-4 shadow-sm p-5">
              <div class="fs-1 mb-2">🍽️</div>
              <h4 class="fw-bold">No orders placed yet</h4>
              <p class="text-muted small mb-4">You haven't ordered any delicious food yet. Check out our popular restaurants!</p>
              <a href="/restaurants.html" class="btn btn-hb-primary">Browse Restaurants</a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(order => {
          const statusColors = {
            'PLACED': 'bg-secondary',
            'CONFIRMED': 'bg-primary',
            'PREPARING': 'bg-warning text-dark',
            'READY_FOR_PICKUP': 'bg-info text-dark',
            'OUT_FOR_DELIVERY': 'bg-primary',
            'DELIVERED': 'bg-success',
            'CANCELLED': 'bg-danger'
          };
          const badgeClass = statusColors[order.orderStatus] || 'bg-secondary';

          const formattedDate = new Date(order.createdAt).toLocaleDateString('en-IN', {
            day: 'numeric',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          const itemsText = order.orderItems ? order.orderItems.map(i => `${i.quantity} × ${i.foodName}`).join(', ') : 'Delicious meal items';

          return `
            <div class="col-12">
              <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="row align-items-center g-3">
                  <div class="col-md-3">
                    <span class="badge ${badgeClass} mb-2 px-3 py-2 text-uppercase fw-bold">${order.orderStatus.replace(/_/g, ' ')}</span>
                    <h5 class="fw-bold mb-0 text-dark">${order.restaurant ? order.restaurant.name : 'Restaurant Partner'}</h5>
                    <div class="text-muted small">${order.orderNumber}</div>
                  </div>

                  <div class="col-md-5">
                    <div class="small fw-semibold text-secondary mb-1">Items Ordered:</div>
                    <div class="small text-dark mb-1 text-truncate">${itemsText}</div>
                    <div class="small text-muted">Placed on ${formattedDate}</div>
                  </div>

                  <div class="col-md-2 text-md-center">
                    <div class="small text-muted">Total Amount</div>
                    <div class="fs-5 fw-bold text-dark">${formatINR(order.totalAmount)}</div>
                  </div>

                  <div class="col-md-2 text-md-end">
                    <a href="/order-details.html?id=${order.id}" class="btn btn-outline-dark btn-sm fw-bold w-100 py-2">
                      Track Order &rarr;
                    </a>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        document.getElementById('ordersListContainer').innerHTML = `
          <div class="col-12 alert alert-danger">Failed to load orders: ${e.message}</div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadUserOrders);
  </script>
</body>
</html>
