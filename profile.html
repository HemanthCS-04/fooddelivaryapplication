<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - HungerByte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-hb sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="index.html">
        <span class="fs-3">🍔</span>
        <span>Hunger<span class="brand-accent">Byte</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-outline-secondary btn-sm">&larr; Home</a>
        <div id="navbar-auth-section"></div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row g-4">
      <!-- Profile Info Sidebar -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center mb-4">
          <div class="rounded-circle bg-warning text-dark fw-bold d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
            <span id="profileAvatarLetter">U</span>
          </div>
          <h4 class="fw-bold mb-1" id="profileName">User Name</h4>
          <p class="text-muted small mb-2" id="profileEmail">user@example.com</p>
          <div>
            <span class="badge bg-dark px-3 py-2" id="profileRoleBadge">CUSTOMER</span>
          </div>

          <hr class="my-4">

          <div class="d-flex flex-column gap-2 text-start">
            <a href="orders.html" class="btn btn-outline-dark btn-sm text-start py-2">📦 View Order History</a>
            <a href="favorites.html" class="btn btn-outline-dark btn-sm text-start py-2">❤️ Favorite Foods & Restaurants</a>
            <button class="btn btn-outline-danger btn-sm text-start py-2" onclick="AuthManager.logout()">🚪 Sign Out</button>
          </div>
        </div>
      </div>

      <!-- Main Profile Settings -->
      <div class="col-lg-8">
        <!-- Edit Profile Form -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
          <h5 class="fw-bold mb-3">Edit Personal Details</h5>
          <form id="editProfileForm">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Full Name</label>
                <input type="text" id="editName" class="form-control rounded-3" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Phone Number</label>
                <input type="tel" id="editMobile" class="form-control rounded-3">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Email Address</label>
              <input type="email" id="editEmail" class="form-control rounded-3 bg-light" readonly disabled>
              <small class="text-muted">Email address cannot be changed.</small>
            </div>
            <button type="submit" class="btn btn-hb-primary fw-semibold px-4" id="saveProfileBtn">Save Changes</button>
          </form>
        </div>

        <!-- Address Management -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Saved Addresses</h5>
            <button class="btn btn-outline-dark btn-sm" data-bs-toggle="collapse" data-bs-target="#addAddressCard">+ Add Address</button>
          </div>

          <div class="collapse mb-4" id="addAddressCard">
            <div class="p-3 bg-light border rounded-3">
              <h6 class="fw-bold mb-2">Add New Delivery Location</h6>
              <div class="row g-2 mb-2">
                <div class="col-12">
                  <input type="text" id="addStreet" class="form-control form-control-sm" placeholder="Street, Flat, House No, Landmark" required>
                </div>
                <div class="col-md-4">
                  <input type="text" id="addCity" class="form-control form-control-sm" placeholder="City" value="Bangalore">
                </div>
                <div class="col-md-4">
                  <input type="text" id="addState" class="form-control form-control-sm" placeholder="State" value="Karnataka">
                </div>
                <div class="col-md-4">
                  <input type="text" id="addPincode" class="form-control form-control-sm" placeholder="Pincode" value="560038">
                </div>
              </div>
              <button type="button" class="btn btn-sm btn-dark" onclick="submitAddress()">Save Address</button>
            </div>
          </div>

          <div class="d-flex flex-column gap-2" id="addressesContainer">
            <p class="text-muted small">Loading addresses...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    async function loadProfile() {
      const user = AuthManager.getUser();
      const userId = AuthManager.getUserId();

      if (user) {
        document.getElementById('profileName').textContent = user.name;
        document.getElementById('profileEmail').textContent = user.email;
        document.getElementById('profileAvatarLetter').textContent = user.name.charAt(0).toUpperCase();
        document.getElementById('profileRoleBadge').textContent = user.role;
        document.getElementById('editName').value = user.name;
        document.getElementById('editMobile').value = user.mobile || '';
        document.getElementById('editEmail').value = user.email;
      }

      loadAddresses(userId);
    }

    async function loadAddresses(userId) {
      try {
        const res = await apiRequest(`/users/${userId}/addresses`);
        const addresses = res.data || [];
        const cont = document.getElementById('addressesContainer');

        if (addresses.length === 0) {
          cont.innerHTML = `<div class="p-3 bg-light rounded-3 text-muted small">No addresses saved yet.</div>`;
          return;
        }

        cont.innerHTML = addresses.map(a => `
          <div class="p-3 border rounded-3 d-flex justify-content-between align-items-center">
            <div>
              <span class="badge bg-secondary me-2">${a.addressType || 'HOME'}</span>
              <span class="small fw-semibold text-dark">${a.street}, ${a.city}, ${a.state} - ${a.pincode}</span>
            </div>
            <button class="btn btn-link text-danger p-0 small" onclick="deleteAddress(${a.id})">Delete</button>
          </div>
        `).join('');
      } catch (e) {
        console.warn('Could not load addresses:', e);
      }
    }

    async function submitAddress() {
      const street = document.getElementById('addStreet').value.trim();
      const city = document.getElementById('addCity').value.trim();
      const state = document.getElementById('addState').value.trim();
      const pincode = document.getElementById('addPincode').value.trim();
      const userId = AuthManager.getUserId();

      if (!street || !city || !pincode) {
        showToast('Please enter complete address', 'error');
        return;
      }

      try {
        await apiRequest(`/users/${userId}/addresses`, {
          method: 'POST',
          body: JSON.stringify({ street, city, state, pincode, addressType: 'HOME', isDefault: false })
        });
        showToast('Address saved successfully!', 'success');
        bootstrap.Collapse.getInstance(document.getElementById('addAddressCard')).hide();
        loadAddresses(userId);
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function deleteAddress(addrId) {
      const userId = AuthManager.getUserId();
      try {
        await apiRequest(`/users/${userId}/addresses/${addrId}`, { method: 'DELETE' });
        showToast('Address removed', 'info');
        loadAddresses(userId);
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('editName').value.trim();
      const mobile = document.getElementById('editMobile').value.trim();
      const userId = AuthManager.getUserId();

      try {
        const res = await apiRequest(`/users/${userId}`, {
          method: 'PUT',
          body: JSON.stringify({ name, mobile })
        });
        const currentUser = AuthManager.getUser() || {};
        currentUser.name = name;
        currentUser.mobile = mobile;
        AuthManager.setUser(currentUser);
        showToast('Profile updated!', 'success');
        loadProfile();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
